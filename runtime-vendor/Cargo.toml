[package]
name = "horsie-runtime-vendor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blossomstack/horsie"
description = "Runtime vendor library for horsie: the reusable half of a vendor process"
version = "0.1.6"
edition = "2024"

[dependencies]
horsie-models = { version = "0.1.6", path = "../models" }
horsie-support = { version = "0.1.6", path = "../support" }
horsie-runtime-client = { version = "0.1.6", path = "../runtime-client" }
tokio             = { workspace = true, features = ["process", "net"] }
tokio-tungstenite = { workspace = true }
futures-util      = { workspace = true }
serde_json        = { workspace = true }
uuid              = { workspace = true }
thiserror         = { workspace = true }
async-trait       = { workspace = true }
tokio-util        = { workspace = true }

[dev-dependencies]
horsie-runtime-client = { path = "../runtime-client", features = ["test-util"] }
horsie-server = { path = "../server" }
tempfile = "3"

[lints]
workspace = true
