name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Every base, not only `main`. A stacked PR targets its parent branch, so
    # gating on `main` gave every PR in a stack but the bottom one *zero* checks
    # — the ones most in need of review were the ones nobody could verify.
    branches: ["**"]
    # Include `edited` so a PR auto-retargeted onto main (e.g. when its parent
    # in a stack merges) triggers CI — the default types omit base-branch changes.
    types: [opened, synchronize, reopened, edited]

# Least privilege: jobs only need to read the repo. Elevate per-job if ever needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned Rust toolchain — single source of truth for CI. Bump deliberately
  # (a new stable can introduce clippy lints that fail under -D warnings).
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      # The #61 red catalogue: known-broken behaviours that now have real tests.
      # Failing here is the EXPECTED state, so this job never blocks a merge. Its
      # only purpose is to surface a red test that has quietly gone *green* — a
      # finding fixed as a side effect, which should then be closed deliberately
      # rather than left ignored and rotting. Run locally with:
      #   cargo test --workspace --all-features --no-fail-fast -- --ignored
      # `--no-fail-fast` matters: without it cargo stops at the first failing test
      # binary and the remaining red tests are never reported.
      - name: Red catalogue (#61)
        continue-on-error: true
        run: cargo test --locked --workspace --all-features --no-fail-fast -- --ignored

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    # The same suite as `check`, against PostgreSQL instead of SQLite. Every
    # test that touches storage goes through `db::testing::db()`, which picks
    # its backend from HORSIE_TEST_POSTGRES_URL — so this is a portability run
    # over the whole suite, not just the tests written with two backends in
    # mind. A query that works on SQLite and breaks here fails in whichever
    # test already covers that code path.
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Tests
        env:
          # Each test creates its own database on this server, so the suite's
          # tests stay isolated from one another.
          HORSIE_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked --workspace --all-features

  cargo-deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  ts-types:
    name: TypeScript types (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      # The `fluorite` CLI that generates the TypeScript types is shipped by the
      # `fluorite_codegen` crate (the `fluorite` crate itself is a library). Pin
      # to the EXACT workspace codegen version so the drift check is deterministic
      # — bump this in lockstep with the `fluorite_codegen` workspace dep. Node is
      # preinstalled on the GitHub-hosted runner.
      - name: Install fluorite CLI
        run: cargo install fluorite_codegen --version =0.7.0

      - name: Regenerate and typecheck
        run: make ts-types

      # `git diff` alone misses a generated file that is new and untracked, and
      # before `generate-types` cleaned first it also missed orphans — a file
      # left behind by a renamed type never changes, so it never drifts.
      # `git status --porcelain` covers modified, deleted and untracked alike.
      - name: Fail on uncommitted drift
        run: |
          drift="$(git status --porcelain clients/ts/src/generated)"
          if [ -n "$drift" ]; then
            echo "generated types are out of sync with crates/models/fluorite:"
            echo "$drift"
            exit 1
          fi

  web-unit:
    name: Web unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install web dependencies
        working-directory: clients/web
        run: bun install --frozen-lockfile

      - name: Run unit tests
        working-directory: clients/web
        run: bun run test:unit

      # The design system calls this "the gate" for WCAG AA across all four
      # skins in both modes. It was only ever a command someone remembered to
      # run; a colour token can regress contrast without failing anything else.
      - name: Contrast (all skins, both modes)
        working-directory: clients/web
        run: bun run contrast

  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      # Build the three binaries the harness spawns (debug — the harness resolves
      # them from target/debug). HORSIE_E2E_SKIP_BUILD below makes global-setup
      # assert-and-use these rather than rebuild, so build failures surface here.
      - name: Build server, runtime, mock LLM
        run: |
          cargo build --locked -p horsie-server -p horsie -p horsie-runtime
          cargo build --locked -p async-llm --bin async-llm-mock

      # Install Bun via its official script (no new pinned action) and add it to PATH.
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install web dependencies
        working-directory: clients/web
        run: bun install --frozen-lockfile

      - name: Build web assets
        working-directory: clients/web
        run: bun run build

      - name: Install Playwright Chromium (+ OS deps)
        working-directory: clients/web
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: clients/web
        env:
          HORSIE_E2E_SKIP_BUILD: "1"
        run: ./node_modules/.bin/playwright test
