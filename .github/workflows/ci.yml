name: CI

on:
  push:
    branches: [main]
    # Release tags run the full suite too: the publish job below is what builds
    # and pushes the versioned images, and a tag can be cut from a commit whose
    # CI never ran or was cancelled.
    tags: ["v*"]
  pull_request:
    # Every base, not only `main`. A stacked PR targets its parent branch, so
    # gating on `main` gave every PR in a stack but the bottom one *zero* checks
    # — the ones most in need of review were the ones nobody could verify.
    branches: ["**"]
    # Include `edited` so a PR auto-retargeted onto main (e.g. when its parent
    # in a stack merges) triggers CI — the default types omit base-branch changes.
    types: [opened, synchronize, reopened, edited]

# Least privilege: jobs only need to read the repo. Elevate per-job if ever needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes — but only for pull
# requests. A push run now ends in the image publish, and cancelling that
# midway can land the per-arch digests in GHCR without ever assembling the
# manifest list that gives them a tag, leaving blobs nothing points at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned Rust toolchain — single source of truth for CI. Bump deliberately
  # (a new stable can introduce clippy lints that fail under -D warnings).
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Publish surface
        run: ./scripts/check-publish-surface.sh

      - name: Tests
        run: cargo test --locked --workspace --all-features

  postgres:
    # Named for PostgreSQL alone for now because this is a *required* status
    # check, and the required set is declared elsewhere as infrastructure —
    # renaming the job without changing that in the same breath leaves a
    # required check permanently pending and blocks every merge. What it runs
    # is already broader than the name: the backends a clustered deployment
    # uses.
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    # The same suite as `check`, against the services a cluster runs on rather
    # than the single-node defaults. Every test that touches storage goes
    # through `db::testing::db()` and every test that touches the bus resolves
    # one, and both pick their backend from the environment — so this is a
    # portability run over the whole suite, not just the tests written with two
    # backends in mind. A query that works on SQLite and breaks here, or a
    # publish that works in-process and is lost over Redis, fails in whichever
    # test already covers that code path.
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.1

      - name: Tests
        env:
          # Each test creates its own database on this server, so the suite's
          # tests stay isolated from one another.
          HORSIE_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Tests that need two nodes talking to one another skip themselves
          # without this, so an unset value is a quietly weaker run rather than
          # a failure — which is exactly why it is set here and nowhere else.
          HORSIE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --locked --workspace --all-features

  cargo-deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  ts-types:
    name: TypeScript types (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.1

      # The `fluorite` CLI that generates the TypeScript types is shipped by the
      # `fluorite_codegen` crate (the `fluorite` crate itself is a library). Pin
      # to the EXACT workspace codegen version so the drift check is deterministic
      # — bump this in lockstep with the `fluorite_codegen` workspace dep.
      - name: Install fluorite CLI
        run: cargo install fluorite_codegen --version =0.7.0

      # `clients/web` regenerates through its own package script, which bun runs.
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # The generated tree is committed and nothing else regenerates it: the web
      # jobs build against whatever is checked in. Without this the schemas and
      # the types they generate can diverge silently.
      - name: Regenerate
        run: make types

      # `git diff` alone misses a generated file that is new and untracked, and
      # before `generate-types` cleaned first it also missed orphans — a file
      # left behind by a renamed type never changes, so it never drifts.
      # `git status --porcelain` covers modified, deleted and untracked alike.
      - name: Fail on uncommitted drift
        run: |
          drift="$(git status --porcelain clients/web/src/generated)"
          if [ -n "$drift" ]; then
            echo "generated types are out of sync with crates/models/fluorite:"
            echo "$drift"
            exit 1
          fi

  # Deliberately NOT path-filtered. A filtered job never reports on a PR that
  # does not touch docs/, and a required check that never reports stays pending
  # forever. It is seconds of work; running it always is cheaper than the
  # confusion.
  docs:
    name: Docs (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      # The frontmatter contract and the framing rules from
      # docs/src/content/docs/contributing/writing-docs.md.
      - name: Prose lint
        working-directory: docs
        run: bun run lint:prose

      # Also validates the content schema and every internal link and anchor.
      - name: Build
        working-directory: docs
        run: bun run build

  web-unit:
    name: Web unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install web dependencies
        working-directory: clients/web
        run: bun install --frozen-lockfile

      - name: Run unit tests
        working-directory: clients/web
        run: bun run test:unit

      # The design system calls this "the gate" for WCAG AA across all four
      # skins in both modes. It was only ever a command someone remembered to
      # run; a colour token can regress contrast without failing anything else.
      - name: Contrast (all skins, both modes)
        working-directory: clients/web
        run: bun run contrast

  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.1

      # Build the three binaries the harness spawns (debug — the harness resolves
      # them from target/debug). HORSIE_E2E_SKIP_BUILD below makes global-setup
      # assert-and-use these rather than rebuild, so build failures surface here.
      - name: Build server, runtime, mock LLM
        run: |
          cargo build --locked -p horsie-server -p horsie -p horsie-runtime
          cargo build --locked -p async-llm --bin async-llm-mock

      # Install Bun via its official script (no new pinned action) and add it to PATH.
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install web dependencies
        working-directory: clients/web
        run: bun install --frozen-lockfile

      - name: Build web assets
        working-directory: clients/web
        run: bun run build

      - name: Install Playwright Chromium (+ OS deps)
        working-directory: clients/web
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: clients/web
        env:
          HORSIE_E2E_SKIP_BUILD: "1"
        run: ./node_modules/.bin/playwright test

  # The gate. Docker used to publish from its own workflow on the same push,
  # concurrently with this one, so a red main still shipped images — and ops,
  # which polls GHCR every 15 minutes and opens a tag-bump PR, pinned
  # deployments to them. Every job above must be green before anything reaches
  # the registry.
  #
  # Listing the jobs by hand is the only way GitHub expresses "all of them";
  # a new job added above must be added here too or it silently stops gating.
  #
  # docker.yml still owns the build itself, and still gates pull requests on
  # its own (a no-push build of every image). It is `workflow_call`-only for
  # pushes now. The `github` context inside a called workflow is the CALLER's,
  # so its existing conditions still read the right event and ref: `latest`
  # tracks main, and a `v*` tag still gets its semver tags.
  publish-images:
    name: Publish images
    if: github.event_name == 'push'
    needs: [check, postgres, cargo-deny, ts-types, docs, web-unit, web-e2e]
    uses: ./.github/workflows/docker.yml
    # A called workflow's permissions are capped by the calling job's, so the
    # full set the publish needs has to be granted here: packages to push,
    # id-token for keyless cosign signing, attestations for provenance.
    # No `secrets: inherit`: GITHUB_TOKEN reaches a called workflow on its own,
    # and it is the only secret docker.yml reads.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
