name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write # stores signatures on the cla-signatures branch
      pull-requests: write
      statuses: write
    steps:
      - name: Check or record CLA signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/blossomstack/horsie/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: zxgshawn,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged you need to
            sign the [Contributor License Agreement](https://github.com/blossomstack/horsie/blob/main/CLA.md).
            You keep the copyright to your work — the CLA lets horsie relicense
            the project later without chasing every contributor.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
