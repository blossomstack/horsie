[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
fluorite         = "0.7.0"
fluorite_codegen = "0.7.0"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
schemars         = "1.0"
derive-new       = "0.7"
async-trait      = "0.1"
thiserror        = "2.0"
tokio             = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-util        = { version = "0.7" }
tokio-stream      = { version = "0.1", features = ["sync"] }
# `native-tls` is not optional: vendor processes and runtimes dial `wss://` URLs
# whenever the session server sits behind HTTPS, and without a TLS feature
# `connect_async` rejects those before any I/O ("TLS support not compiled in").
# native-tls rather than rustls because reqwest's default-tls already links it
# into every one of these binaries, and it reads the OS trust store — so a
# self-hosted server behind a private CA works once that CA is trusted here.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util      = "0.3"
uuid              = { version = "1", features = ["v4", "v5", "serde"] }
rand              = "0.10"
argon2            = "0.5"
# The event-sourced actor runtime the session and agent trees are built on. It
# used to live at `crates/actor`; it is domain-free, so it was moved out to
# github.com/blossomstack/horsie-actor and is consumed by version like any other
# third-party crate. Declared here rather than per-crate so both consumers move
# in lockstep — two members on different versions would be two incompatible
# `Journal` traits.
horsie-actor      = "0.7"
# Protocol modules are opt-in per crate: `anthropic`, `openai`, `responses`,
# `mock`. TLS is picked here so every member links the same reqwest backend.
async-llm         = { version = "0.10.0", default-features = false, features = ["rustls"] }
axum              = { version = "0.8", features = ["macros"] }
tower-http        = { version = "0.7", features = ["fs"] }
parking_lot       = "0.12"
tracing           = "0.1"
url               = "2"
reqwest           = { version = "0.12", features = ["json"] }
eventsource-stream    = "0.2.3"
reqwest-eventsource = "0.6.0"
tempfile          = "3"
jsonschema        = "0.49"
# 11 made the crypto backend opt-in: with neither feature on, every sign/verify
# panics at runtime asking for a provider, and with both the selection is
# ambiguous. `aws_lc_rs` rather than `rust_crypto` because the pure-Rust backend
# pulls in `rsa`, which carries RUSTSEC-2023-0071 (Marvin Attack — key recovery
# through timing sidechannels, still unpatched). aws-lc-rs is already linked
# into these binaries by rustls, so this adds no new build dependency.
# `use_pem` is in the crate's default set and is what provides
# `EncodingKey::from_rsa_pem`, which the GitHub App JWT needs.
jsonwebtoken      = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
base64            = "0.23"
sha2              = "0.11"
# hmac 0.13 is the release that pairs with sha2 0.11 (both on digest 0.11), and
# it moved `new_from_slice` onto `KeyInit`, so the call site is qualified.
hmac              = "0.13"
# sha2 0.11 returns `hybrid_array::Array` from `finalize()`, which has no
# `LowerHex` impl — `format!("{:x}", …)` no longer compiles. These digests are
# persisted (plugin artifact ids, source keys), so the encoding must stay
# byte-identical lowercase hex; `hex::encode` is exactly that.
hex               = "0.4"
zip               = { version = "8", default-features = false, features = ["deflate"] }
eval              = "0.4"
# SQLite-backed settings store for the session server (Postgres-ready: add the
# `postgres` feature + a driver later). Runtime queries (no compile-time DB) +
# embedded migrations, so CI needs no DATABASE_URL.
sqlx              = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }

# Production code bans panic-prone constructs; test code opts out per-file via
# #![cfg_attr(test, allow(clippy::unwrap_used, ...))]
[workspace.lints.clippy]
unwrap_used             = "deny"
expect_used             = "deny"
panic                   = "deny"
wildcard_enum_match_arm = "deny"
