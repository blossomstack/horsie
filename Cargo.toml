[workspace]
members = [
    "actor",
    "agentcore",
    "workflow",
    "server",
    "runtime-vendor",
    "runtime",
    "models",
    "support",
    "providers/anthropic",
    "providers/openai",
    "providers/openai-responses",
    "providers/mock-llm",
    "runtime-client",
    "mcp-client",
    "cli",
    "velos-runtime",
    "tests",
]
resolver = "2"

[workspace.dependencies]
fluorite         = "0.6.0"
fluorite_codegen = "0.6.0"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
schemars         = "1.0"
derive-new       = "0.7"
async-trait      = "0.1"
thiserror        = "2.0"
tokio             = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-util        = { version = "0.7" }
tokio-stream      = { version = "0.1", features = ["sync"] }
# `native-tls` is not optional: vendor agents and runtimes dial `wss://` URLs
# whenever the session server sits behind HTTPS, and without a TLS feature
# `connect_async` rejects those before any I/O ("TLS support not compiled in").
# native-tls rather than rustls because reqwest's default-tls already links it
# into every one of these binaries, and it reads the OS trust store — so a
# self-hosted server behind a private CA works once that CA is trusted here.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util      = "0.3"
uuid              = { version = "1", features = ["v4", "v5", "serde"] }
rand              = "0.8"
argon2            = "0.5"
async-llm         = "0.8.0"
axum              = { version = "0.7", features = ["macros"] }
tower-http        = { version = "0.6", features = ["fs"] }
parking_lot       = "0.12"
tracing           = "0.1"
reqwest           = { version = "0.13", features = ["json"] }
reqwest-eventsource = "0.6.0"
tempfile          = "3"
jsonschema        = "0.49"
jsonwebtoken      = "9"
base64            = "0.23"
sha2              = "0.10"
zip               = { version = "8", default-features = false, features = ["deflate"] }
eval              = "0.4"
# SQLite-backed settings store for the session server (Postgres-ready: add the
# `postgres` feature + a driver later). Runtime queries (no compile-time DB) +
# embedded migrations, so CI needs no DATABASE_URL.
sqlx              = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }

# Production code bans panic-prone constructs; test code opts out per-file via
# #![cfg_attr(test, allow(clippy::unwrap_used, ...))]
[workspace.lints.clippy]
unwrap_used             = "deny"
expect_used             = "deny"
panic                   = "deny"
wildcard_enum_match_arm = "deny"
