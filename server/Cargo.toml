[package]
name = "horsie-server"
license = "MIT OR Apache-2.0"
version = "0.1.6"
edition = "2024"
publish = false # internal application crate, never published to crates.io

[features]
# Exposes `vendor::mock::MockVendor` to external test crates. Off by default, so
# a production build of horsie-server never contains a mock runtime vendor.
test-util = ["horsie-runtime-client/test-util"]

[dependencies]
horsie-models          = { path = "../models" }
horsie-support         = { path = "../support", features = ["git"] }
horsie-actor           = { path = "../actor" }
horsie-agentcore       = { path = "../agentcore" }
horsie-anthropic       = { path = "../providers/anthropic" }
horsie-openai          = { path = "../providers/openai" }
horsie-openai-responses = { path = "../providers/openai-responses" }
horsie-workflow        = { path = "../workflow" }
horsie-runtime-vendor  = { path = "../runtime-vendor" }
horsie-runtime-client  = { path = "../runtime-client" }
horsie-mcp-client      = { path = "../mcp-client" }
clap              = { version = "4", features = ["derive"] }
sqlx              = { workspace = true }
axum              = { workspace = true }
hyper             = "1"
hyper-util        = { version = "0.1", features = ["tokio"] }
tower-http        = { workspace = true }
tokio             = { workspace = true }
tokio-stream      = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util        = { workspace = true }
futures-util      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
reqwest           = { workspace = true }
tracing           = { workspace = true }
uuid              = { workspace = true }
eval              = { workspace = true }
thiserror         = { workspace = true }
async-trait       = { workspace = true }
jsonwebtoken      = { workspace = true }
jiff              = "0.2"
base64            = { workspace = true }
sha2              = { workspace = true }
hex               = { workspace = true }
rand              = { workspace = true }
argon2            = { workspace = true }
zip               = { workspace = true }
tempfile          = { workspace = true }

[dev-dependencies]
# The journal conformance suite lives in the actor testkit, so SqlJournal is held
# to exactly the same contract as InMemoryJournal.
horsie-actor           = { path = "../actor", features = ["test-util"] }
tempfile = { workspace = true }
# `start_paused` runtimes, so a test about a 45s idle timeout takes no wall time.
tokio    = { workspace = true, features = ["test-util"] }
tower    = { version = "0.5", features = ["util"] }
# MockProvider/scripted completions for subagent routing tests; production
# builds never see the testkit.
horsie-agentcore = { path = "../agentcore", features = ["test-util"] }
horsie-runtime-client = { path = "../runtime-client", features = ["test-util"] }
# `db::testing` and the SqlJournal suite live behind this crate's own
# `test-util`, which integration tests do not otherwise enable.
horsie-server = { path = ".", features = ["test-util"] }

[lints]
workspace = true
