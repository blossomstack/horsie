[package]
name = "horsie-actor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blossomstack/horsie"
description = "Actor primitives with durable journaling for horsie"
version = "0.1.6"
edition = "2024"

[features]
# Exposes `testkit` (FaultyJournal) to other crates.
# actor's own unit tests get it via `cfg(test)` without the feature.
test-util = []

[dependencies]
async-trait  = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
futures-util = { workspace = true }
parking_lot  = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Self-dependency so this crate's own integration tests (actor/tests/) see the
# optional features. Unit tests get `testkit` via cfg(test); a test *binary* is a
# separate crate and does not.
horsie-actor = { path = ".", features = ["test-util"] }

[lints]
workspace = true
