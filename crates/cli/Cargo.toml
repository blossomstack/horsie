[package]
name = "horsie"
version = "0.1.6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blossomstack/horsie"
description = "Sandboxed orchestration for LLM agent graphs"

[[bin]]
name = "horsie"
path = "src/main.rs"

[dependencies]
horsie-models = { version = "0.1.6", path = "../models" }
horsie-runtime-host = { version = "0.1.6", path = "../runtime-host" }
horsie-support = { version = "0.1.6", path = "../support", features = ["git"] }
clap            = { version = "4", features = ["derive"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
tokio           = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "signal"] }
tokio-util      = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
reqwest           = { workspace = true, features = ["stream"] }
reqwest-eventsource = { workspace = true }
futures-util      = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
tempfile = "3"

[lints]
workspace = true
