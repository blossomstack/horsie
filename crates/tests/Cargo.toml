[package]
name = "integration-tests"
license = "MIT OR Apache-2.0"
version = "0.5.0"
edition = "2024"
publish = false # internal application crate, never published to crates.io

[dependencies]
# Not a dev-dependency: this is what turns on `mock` for a plain `cargo build`,
# so `cargo build -p async-llm --bin async-llm-mock` can produce the e2e server.
async-llm = { workspace = true, features = ["mock"] }

[dev-dependencies]
horsie-runtime-host = { path = "../runtime-host", features = ["test-util"] }
horsie-agentcore = { path = "../agentcore", features = ["test-util"] }
horsie-llm-providers = { path = "../llm-providers" }
horsie-server = { path = "../server", features = ["test-util"] }
horsie-actor = { workspace = true }
horsie-models = { path = "../models" }
horsie-runtime = { path = "../runtime" }
horsie-support = { path = "../support" }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util  = { workspace = true }
async-trait = { workspace = true }
serde_json  = { workspace = true }
axum        = { workspace = true }
reqwest     = { workspace = true, features = ["stream"] }
tempfile    = { workspace = true }
uuid        = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
# The cluster harness creates its own database: three nodes are nodes that
# agree on one journal, so each test needs a fresh one they can all share.
sqlx = { workspace = true }

[lints]
workspace = true
