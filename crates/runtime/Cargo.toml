[package]
name = "horsie-runtime"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blossomstack/horsie"
description = "Sandboxed per-job runtime child for horsie"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "horsie-runtime"
path = "src/main.rs"

[features]
default = ["sandbox"]
sandbox = ["dep:nono"]

[dependencies]
horsie-models = { version = "0.2.0", path = "../models" }
horsie-support = { version = "0.2.0", path = "../support" }
tokio         = { workspace = true, features = ["process", "net"] }
tokio-tungstenite = { workspace = true }
futures-util  = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
clap          = { version = "4", features = ["derive"] }
tracing       = { workspace = true }
async-trait   = { workspace = true }
regex         = "1"
glob          = "0.3"
# killpg(2) on timeout: SIGKILL the command's process group, not just bash.
libc          = "0.2"
base64        = { workspace = true }
reqwest       = { workspace = true }
sha2          = { workspace = true }
hex               = { workspace = true }
zip           = { workspace = true }
# Upstream nono. The macOS SecurityServer TLS allow is injected as a capability rule
# (see server/src/default_capabilities.json), not a fork. default-features=false drops system-keyring.
nono          = { version = "0.71", default-features = false, optional = true }

[dev-dependencies]
tempfile      = "3"
horsie-runtime-host = { path = "../runtime-host" }
tokio-util      = { workspace = true }

[lints]
workspace = true
