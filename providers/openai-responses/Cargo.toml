[package]
name = "horsie-openai-responses"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blossomstack/horsie"
description = "OpenAI Responses-API provider for horsie, with API-key or ChatGPT-plan credentials"
version = "0.1.6"
edition = "2024"

[dependencies]
horsie-agentcore = { version = "0.1.6", path = "../../agentcore" }
horsie-models = { version = "0.1.6", path = "../../models" }
async-trait         = { workspace = true }
base64              = { workspace = true }
tokio               = { workspace = true, features = ["time", "sync"] }
futures-util        = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
tracing             = { workspace = true }
reqwest             = { workspace = true, features = ["json", "stream", "cookies"] }
reqwest-eventsource = { workspace = true }

[dev-dependencies]
horsie-mock-llm = { path = "../mock-llm" }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
