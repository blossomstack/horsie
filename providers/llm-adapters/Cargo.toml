[package]
name = "horsie-llm-adapters"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
horsie-agentcore = { path = "../../agentcore" }
horsie-models = { path = "../../models" }
async-llm = { version = "0.9.0", default-features = false, features = ["openai", "responses", "rustls"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
async-llm = { version = "0.9.0", default-features = false, features = ["mock", "rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
