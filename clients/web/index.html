<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>horsie</title>
    <script>
      // Resolve world, exposure AND text size before first paint. `useTheme`
      // sets the same three attributes, but it runs after hydration, so a
      // hardcoded default flashed the wrong world at everyone who had chosen
      // another one. Text size is worse than a colour flash: it reflows the
      // whole layout, so it has to be resolved here too.
      (function () {
        try {
          var t = localStorage.getItem("horsie-theme");
          document.documentElement.dataset.theme =
            t === "light" || t === "dark"
              ? t
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var k = localStorage.getItem("horsie-skin");
          if (k === "ink" || k === "aurora" || k === "glass") {
            document.documentElement.dataset.skin = k;
          }
          var z = localStorage.getItem("horsie-text-size");
          if (z === "compact" || z === "large") {
            document.documentElement.dataset.textSize = z;
          }
        } catch (e) {
          /* private mode: fall back to the attribute already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      DIRECTION: one quiet surface. horsie is a long-running process you watch,
      so the interface shows state and gets out of the way.
      NOTHING IS SEPARATED BY A LINE — regions differ by a small step in value,
      by whitespace and by type weight. The only borders in the build are the
      ones that carry meaning alone: an error outline, a focus ring, a tree
      rail, a graph edge.
      A FILL MEANS SOMETHING HAPPENED — hover, selection, or machine output.
      ONE ACCENT: indigo commits, `live` is a value in flight, red interrupts.
      Light and dark are the same design at two exposures, not two designs.
      INVARIANT: status is a lamp AND a word, code keeps its own palette, and
      AA is measured in both exposures by clients/web/scripts/contrast.mjs.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
