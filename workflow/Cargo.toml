[package]
name = "horsie-workflow"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blossomstack/horsie"
description = "Agent workflow graphs for horsie"
version = "0.1.6"
edition = "2024"

[dependencies]
horsie-actor = { version = "0.1.6", path = "../actor" }
horsie-agentcore = { version = "0.1.6", path = "../agentcore" }
horsie-runtime-client = { version = "0.1.6", path = "../runtime-client" }
horsie-support = { version = "0.1.6", path = "../support" }
horsie-models = { version = "0.1.6", path = "../models" }
async-trait    = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }
futures-util   = { workspace = true }

[dev-dependencies]
horsie-agentcore = { path = "../agentcore", features = ["test-util"] }
horsie-runtime-client = { path = "../runtime-client", features = ["test-util"] }
async-trait  = { workspace = true }

[lints]
workspace = true
