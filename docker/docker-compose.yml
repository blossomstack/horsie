# One-command self-host: `docker compose -f docker/docker-compose.yml up -d`.
# Pulls the published server image (server+web on one port, see
# ../docker/horsie.Dockerfile). A `horsie connect` from any machine can dial
# straight in — user runtimes are accepted by default. Providers/models
# are NOT seeded here — add them via Settings after first boot.
name: horsie

services:
  horsie:
    image: ghcr.io/blossomstack/horsie:latest
    container_name: horsie
    restart: unless-stopped
    ports:
      - "3789:3789" # HTTP API + web UI
    configs:
      - source: horsie_config
        target: /etc/horsie/config.json
    volumes:
      - horsie-data:/data
      # Clustered only. This node's Raft vote, and it must be this node's own
      # volume — two nodes sharing one is two nodes voting as one.
      # - horsie-raft:/raft
    command:
      - --config
      - /etc/horsie/config.json
      - --addr
      - 0.0.0.0:3789
      - --web
      - /usr/local/share/horsie/web

configs:
  horsie_config:
    content: |
      {
        "storage": {
          "state_dir": "/data/state",
          "data_dir": "/data/data"
        }
      }
      # Running this node as one of a cluster needs all three of the blocks
      # below, and the boot refuses the configuration if any is missing or
      # wrong — a node that believes it is clustered and is not looks healthy
      # while losing everything meant to cross between nodes.
      #
      #   "database": { "url": "postgres://user:pass@host/horsie" },
      #   "bus":      { "url": "redis://host:6379" },
      #   "cluster":  {
      #     "node_id":  1,
      #     "bind":     "0.0.0.0:7100",
      #     "peers":    { "2": "node2:7100", "3": "node3:7100" },
      #     "secret":   "<the same value on every node>",
      #     "raft_dir": "/raft"
      #   }
      #
      # SQLite is refused: three nodes need one journal, and a file per node
      # gives three divergent histories. `peers` seeds consensus only on a
      # first boot; after that membership lives in the Raft log, so editing it
      # will not reshape a running cluster. `secret` authenticates peers but
      # does not encrypt them — keep that port on a private network.

volumes:
  horsie-data:
  # Clustered only; see the volume note on the service above.
  # horsie-raft:
