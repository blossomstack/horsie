[package]
name = "horsie-llm-providers"
license = "MIT OR Apache-2.0"
version = "0.1.6"
edition = "2024"
publish = false # adapters onto horsie's own traits, of no use outside it

[dependencies]
horsie-agentcore = { path = "../agentcore" }
horsie-models = { path = "../models" }
async-llm = { workspace = true, features = ["anthropic", "openai", "responses"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
async-llm = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
