# Render Blueprint for the "Deploy to Render" button in README.md.
# Provisions the published server image plus a managed Postgres database;
# HORSIE_DATABASE_URL can be edited after deploy to point at any external
# postgres:// instance instead (see docs/guide/self-hosting.md).
databases:
  - name: horsie-db
    plan: free

services:
  - type: web
    name: horsie
    runtime: image
    plan: free
    image:
      # Pinned to a release, not `latest`: `latest` tracks main, and a runtime
      # from get.horsie.dev is built from the newest release, so `latest` pairs
      # the two across a link with no version handshake. publish.yml's
      # version-guard fails a release that leaves this stale.
      url: ghcr.io/blossomstack/horsie:0.3.0
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3789"
      - key: HORSIE_DATABASE_URL
        fromDatabase:
          name: horsie-db
          property: connectionString
